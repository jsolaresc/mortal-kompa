<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="description" content="Mortal Kompa: juego de pelea entre amigos y familia. Jugá en el navegador, contra la CPU, de a dos o online con un link.">
  <meta property="og:title" content="Mortal Kompa">
  <meta property="og:description" content="¡Te desafío a una pelea! Juego de pelea en el navegador.">
  <title>Mortal Kompa</title>
  <link rel="icon" href="assets/ui/app_icon_192.png">
  <link rel="apple-touch-icon" href="assets/ui/app_icon_192.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mortal Kompa">
  <meta property="og:url" content="https://jsolaresc.github.io/mortal-kompa/web/">
  <meta property="og:image" content="https://jsolaresc.github.io/mortal-kompa/web/assets/ui/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://jsolaresc.github.io/mortal-kompa/web/assets/ui/share.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="share" class="hidden">
    <label class="row">Tu nombre
      <input id="share-name" maxlength="16" placeholder="Ej: Joaquín" autocomplete="nickname">
    </label>
    <div id="share-link-box">
      <div class="label">Link</div>
      <input id="share-link" readonly>
      <div class="buttons">
        <button id="share-copy" type="button">Copiar link</button>
        <button id="share-native" type="button">Compartir</button>
      </div>
    </div>
  </div>

  <div id="join" class="hidden">
    <div class="label">Código de la sala</div>
    <input id="join-link" placeholder="Ej: ACM1PT" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
    <div class="buttons">
      <button id="join-paste" type="button" class="secondary">Pegar</button>
      <button id="join-go" type="button">Unirse</button>
    </div>
  </div>

  <div id="install-ios" class="hidden">
    <div class="title">Instalar en iPhone</div>
    <ol>
      <li>Abrí esta página en <b>Safari</b>.</li>
      <li>Tocá <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li>
      <li>Elegí <b>Agregar a pantalla de inicio</b>.</li>
    </ol>
    <div>Queda el ícono de Mortal Kompa: abrilo desde ahí y se juega en pantalla completa.</div>
    <div class="buttons"><button type="button" onclick="document.getElementById('install-ios').classList.add('hidden')">Entendido</button></div>
  </div>
  </div>

  <script src="lib/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
