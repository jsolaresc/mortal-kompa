# Publica la versión de NAVEGADOR (carpeta web/) en GitHub Pages.
# HOY Pages está configurado como "Deploy from a branch: main / (root)": publica
# el repo entero y el index.html de la raíz redirige a web/. Este workflow queda
# solo para correr a mano, por si algún día se cambia Settings > Pages > Source
# a "GitHub Actions" (link más corto, sin /web/).
name: Publicar web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
